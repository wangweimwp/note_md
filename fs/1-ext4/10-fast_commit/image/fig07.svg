<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 536" width="680" role="img"><style>text{font-family:'Microsoft YaHei',sans-serif;}text.th{font-size:14px;font-weight:500;}text.ts{font-size:12px;}.arr{stroke:#888780;stroke-width:1.5;fill:none;}.leader{stroke:#B4B2A9;stroke-width:0.5;stroke-dasharray:3 3;fill:none;}</style>
<title>fast commit 提交调用链</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="190" y="40" width="300" height="56" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text class="th" x="340" y="60" text-anchor="middle" dominant-baseline="central" fill="#B5D4F4">ext4_sync_file → ext4_fsync_journal</text>
<text class="ts" x="340" y="78" text-anchor="middle" dominant-baseline="central" fill="#85B7EB">fsync.c · 先刷数据；非普通文件→force_commit</text>
<line class="arr" x1="340" y1="96" x2="340" y2="128" marker-end="url(#arrow)"/>
<rect x="190" y="132" width="300" height="56" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
<text class="th" x="340" y="152" text-anchor="middle" dominant-baseline="central" fill="#9FE1CB">ext4_fc_commit</text>
<text class="ts" x="340" y="170" text-anchor="middle" dominant-baseline="central" fill="#5DCAA5">fast_commit.c · 统计、-EALREADY 重试、编排</text>
<line class="arr" x1="340" y1="188" x2="340" y2="220" marker-end="url(#arrow)"/>
<rect x="190" y="224" width="300" height="56" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
<text class="th" x="340" y="244" text-anchor="middle" dominant-baseline="central" fill="#9FE1CB">jbd2_fc_begin_commit</text>
<text class="ts" x="340" y="262" text-anchor="middle" dominant-baseline="central" fill="#5DCAA5">commit.c · 置 FAST_COMMIT_ONGOING，互斥完整提交</text>
<line class="arr" x1="490" y1="252" x2="426" y2="252" marker-end="url(#arrow)"/>
<text class="ts" x="536" y="240" text-anchor="middle" fill="#F09595">ineligible</text>
<rect x="430" y="224" width="210" height="56" rx="8" fill="#791F1F" stroke="#F09595" stroke-width="0.5"/>
<text class="th" x="535" y="244" text-anchor="middle" dominant-baseline="central" fill="#F7C1C1">fc_end_commit_fallback</text>
<text class="ts" x="535" y="262" text-anchor="middle" dominant-baseline="central" fill="#F09595">转 journal_commit_transaction</text>
<line class="arr" x1="340" y1="280" x2="340" y2="312" marker-end="url(#arrow)"/>
<rect x="190" y="316" width="300" height="56" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
<text class="th" x="340" y="336" text-anchor="middle" dominant-baseline="central" fill="#9FE1CB">ext4_fc_perform_commit</text>
<text class="ts" x="340" y="354" text-anchor="middle" dominant-baseline="central" fill="#5DCAA5">数据落盘→HEAD→dentry→range/inode→TAIL(CRC)</text>
<line class="arr" x1="340" y1="372" x2="340" y2="404" marker-end="url(#arrow)"/>
<rect x="190" y="408" width="300" height="56" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
<text class="th" x="340" y="428" text-anchor="middle" dominant-baseline="central" fill="#9FE1CB">jbd2_fc_wait_bufs → jbd2_fc_end_commit</text>
<text class="ts" x="340" y="446" text-anchor="middle" dominant-baseline="central" fill="#5DCAA5">写 commit record，清标志，唤醒 j_fc_wait</text>
<text class="ts" x="340" y="496" text-anchor="middle" fill="#B4B2A9">完整提交 jbd2_journal_commit_transaction 开始时会先置 FULL_COMMIT_ONGOING，</text>
<text class="ts" x="340" y="518" text-anchor="middle" fill="#B4B2A9">并等待进行中的 fast commit 结束；完成后 j_fc_off 清零、FC 区失效</text>
</svg>