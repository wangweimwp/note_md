<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 612" width="680" role="img"><style>text{font-family:'Microsoft YaHei',sans-serif;}text.th{font-size:14px;font-weight:500;}text.ts{font-size:12px;}.arr{stroke:#888780;stroke-width:1.5;fill:none;}.leader{stroke:#B4B2A9;stroke-width:0.5;stroke-dasharray:3 3;fill:none;}</style>
<title>jbd2_trans_will_send_data_barrier 判定逻辑</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="190" y="40" width="300" height="52" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text class="th" x="340" y="60" text-anchor="middle" dominant-baseline="central" fill="#B5D4F4">jbd2_trans_will_send_data_barrier()</text>
<text class="ts" x="340" y="78" text-anchor="middle" dominant-baseline="central" fill="#85B7EB">fs/jbd2/journal.c · EXPORT_SYMBOL</text>
<line class="arr" x1="340" y1="92" x2="340" y2="108" marker-end="url(#arrow)"/>
<polygon points="340,112 448,148 340,184 232,148" fill="#633806" stroke="#FAC775" stroke-width="0.5"/>
<text x="340" y="148" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#FAEEDA">JBD2_BARRIER?</text>
<line class="arr" x1="448" y1="148" x2="466" y2="148" marker-end="url(#arrow)"/>
<text class="ts" x="456" y="136" text-anchor="middle" fill="#B4B2A9">否</text>
<rect x="470" y="126" width="170" height="44" rx="8" fill="#791F1F" stroke="#F09595" stroke-width="0.5"/>
<text x="555" y="142" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#F7C1C1">return 0</text>
<text x="555" y="158" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#F09595">不支持 barrier</text>
<text class="ts" x="352" y="196" fill="#B4B2A9">是</text>
<line class="arr" x1="340" y1="184" x2="340" y2="204" marker-end="url(#arrow)"/>
<polygon points="340,208 448,244 340,280 232,244" fill="#633806" stroke="#FAC775" stroke-width="0.5"/>
<text x="340" y="244" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#FAEEDA">tid 已提交?</text>
<line class="arr" x1="448" y1="244" x2="466" y2="244" marker-end="url(#arrow)"/>
<text class="ts" x="456" y="232" text-anchor="middle" fill="#B4B2A9">是</text>
<rect x="470" y="222" width="170" height="44" rx="8" fill="#791F1F" stroke="#F09595" stroke-width="0.5"/>
<text x="555" y="238" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#F7C1C1">return 0</text>
<text x="555" y="254" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#F09595">已提交：保守处理</text>
<text class="ts" x="352" y="292" fill="#B4B2A9">否</text>
<line class="arr" x1="340" y1="280" x2="340" y2="300" marker-end="url(#arrow)"/>
<polygon points="340,304 448,340 340,376 232,340" fill="#633806" stroke="#FAC775" stroke-width="0.5"/>
<text x="340" y="340" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#FAEEDA">正是当前 committing?</text>
<line class="arr" x1="448" y1="340" x2="466" y2="340" marker-end="url(#arrow)"/>
<text class="ts" x="456" y="328" text-anchor="middle" fill="#B4B2A9">否</text>
<rect x="470" y="318" width="170" height="44" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="555" y="334" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#9FE1CB">return 1</text>
<text x="555" y="350" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5DCAA5">尚未提交，将来必带 flush</text>
<text class="ts" x="352" y="392" fill="#B4B2A9">是</text>
<line class="arr" x1="340" y1="376" x2="340" y2="408" marker-end="url(#arrow)"/>
<rect x="40" y="412" width="290" height="108" rx="8" fill="#633806" stroke="#FAC775" stroke-width="0.5"/>
<text class="th" x="60" y="436" fill="#FAEEDA">分离设备 j_fs_dev ≠ j_dev</text>
<text class="ts" x="60" y="460" fill="#FAC775">· t_need_data_flush = 0 → ret 0</text>
<text class="ts" x="60" y="484" fill="#FAC775">· t_state ≥ T_COMMIT_DFLUSH → ret 0</text>
<text class="ts" x="60" y="508" fill="#FAC775">· 否则 → ret 1：flush 随提交发出</text>
<rect x="350" y="412" width="290" height="108" rx="8" fill="#633806" stroke="#FAC775" stroke-width="0.5"/>
<text class="th" x="370" y="436" fill="#FAEEDA">同一设备（journal 与数据同盘）</text>
<text class="ts" x="370" y="460" fill="#FAC775">· t_state ≥ T_COMMIT_JFLUSH → ret 0</text>
<text class="ts" x="370" y="484" fill="#FAC775">· 否则 → ret 1：commit record 自带 flush</text>
<rect x="40" y="548" width="600" height="44" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
<text class="ts" x="340" y="570" text-anchor="middle" dominant-baseline="central" fill="#9FE1CB">ret=1 → ext4 不补 flush（提交流程会发）；ret=0 → ext4 置 needs_barrier 自行补发</text>
</svg>