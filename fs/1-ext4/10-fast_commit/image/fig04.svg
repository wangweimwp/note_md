<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 296" width="680" role="img"><style>text{font-family:'Microsoft YaHei',sans-serif;}text.th{font-size:14px;font-weight:500;}text.ts{font-size:12px;}.arr{stroke:#888780;stroke-width:1.5;fill:none;}.leader{stroke:#B4B2A9;stroke-width:0.5;stroke-dasharray:3 3;fill:none;}</style>
<title>崩溃恢复的两段式重放</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="ts" x="340" y="44" text-anchor="middle" fill="#B4B2A9">掉电后重新挂载 ext4 时的恢复顺序</text>
<rect x="40" y="70" width="140" height="64" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text x="110" y="94" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#B5D4F4">① 标准 replay</text>
<text x="110" y="116" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#85B7EB">完整事务块写回原位</text>
<line class="arr" x1="180" y1="102" x2="189" y2="102" marker-end="url(#arrow)"/>
<rect x="193" y="70" width="140" height="64" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="263" y="94" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#9FE1CB">② 扫描 FC 区</text>
<text x="263" y="116" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5DCAA5">校验 TID 与 CRC</text>
<line class="arr" x1="333" y1="102" x2="342" y2="102" marker-end="url(#arrow)"/>
<rect x="346" y="70" width="140" height="64" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="416" y="94" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#9FE1CB">③ 逐 tag 重放</text>
<text x="416" y="116" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5DCAA5">重建 extent 与目录项</text>
<line class="arr" x1="486" y1="102" x2="495" y2="102" marker-end="url(#arrow)"/>
<rect x="499" y="70" width="140" height="64" rx="8" fill="#3C3489" stroke="#AFA9EC" stroke-width="0.5"/>
<text x="569" y="94" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#CECBF6">④ 一致性点</text>
<text x="569" y="116" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#AFA9EC">= 最后完成的 fsync</text>
<rect x="40" y="180" width="290" height="96" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="th" x="60" y="204" fill="#D3D1C7">幂等性设计</text>
<text class="ts" x="60" y="228" fill="#B4B2A9">tag 可安全重复应用；CRC 不匹配</text>
<text class="ts" x="60" y="250" fill="#B4B2A9">则整段 FC 丢弃，仅靠完整提交恢复</text>
<rect x="350" y="180" width="290" height="96" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="th" x="370" y="204" fill="#D3D1C7">与完整提交的关系</text>
<text class="ts" x="370" y="228" fill="#B4B2A9">完整提交（默认 5s）照常进行；</text>
<text class="ts" x="370" y="250" fill="#B4B2A9">之后 FC 区失效清空，供后续复用</text>
</svg>