<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 348" width="680" role="img"><style>text{font-family:'Microsoft YaHei',sans-serif;}text.th{font-size:14px;font-weight:500;}text.ts{font-size:12px;}.arr{stroke:#888780;stroke-width:1.5;fill:none;}.leader{stroke:#B4B2A9;stroke-width:0.5;stroke-dasharray:3 3;fill:none;}</style>
<title>数据与元数据双通道的 flush 衔接</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="ts" x="40" y="110" fill="#B4B2A9">数据</text>
<rect x="100" y="88" width="150" height="44" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text x="175" y="110" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#B5D4F4">page cache 脏页</text>
<line class="arr" x1="250" y1="110" x2="324" y2="110" marker-end="url(#arrow)"/>
<rect x="330" y="88" width="150" height="44" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text x="405" y="110" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#B5D4F4">块设备写缓存</text>
<path d="M486,110 L524,110" fill="none" stroke="#F09595" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<rect x="530" y="88" width="110" height="44" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="585" y="110" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#D3D1C7">持久介质</text>
<text class="ts" x="287" y="148" text-anchor="middle" fill="#85B7EB">write + wait</text>
<text x="505" y="148" text-anchor="middle" font-size="12" fill="#F09595">flush?</text>
<text class="ts" x="40" y="210" fill="#B4B2A9">元数据</text>
<rect x="100" y="188" width="150" height="44" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="175" y="210" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#9FE1CB">元数据变更（事务）</text>
<line class="arr" x1="250" y1="210" x2="324" y2="210" marker-end="url(#arrow)"/>
<rect x="330" y="188" width="150" height="44" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="405" y="210" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#9FE1CB">fc / 完整提交</text>
<line class="arr" x1="480" y1="210" x2="524" y2="210" marker-end="url(#arrow)"/>
<rect x="530" y="188" width="110" height="44" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="585" y="210" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#D3D1C7">commit record</text>
<text class="ts" x="287" y="248" text-anchor="middle" fill="#5DCAA5">提交事务</text>
<text class="ts" x="505" y="248" text-anchor="middle" fill="#B4B2A9">落盘</text>
<text class="ts" x="40" y="286" fill="#B4B2A9">判断依据：jbd2_trans_will_send_data_barrier(journal, commit_tid)</text>
<text class="ts" x="40" y="308" fill="#B4B2A9">· 提交本身会对数据盘发 flush → 无需重复，needs_barrier = false</text>
<text class="ts" x="40" y="330" fill="#B4B2A9">· 否则数据可能还在设备缓存 → 置 needs_barrier，返回前补 flush</text>
</svg>