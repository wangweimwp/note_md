<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 612" width="680" role="img"><style>text{font-family:'Microsoft YaHei',sans-serif;}text.th{font-size:14px;font-weight:500;}text.ts{font-size:12px;}.arr{stroke:#888780;stroke-width:1.5;fill:none;}.leader{stroke:#B4B2A9;stroke-width:0.5;stroke-dasharray:3 3;fill:none;}</style>
<title>ext4_sync_file 控制流</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="200" y="40" width="280" height="52" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text class="th" x="340" y="60" text-anchor="middle" dominant-baseline="central" fill="#B5D4F4">ext4_sync_file()</text>
<text class="ts" x="340" y="78" text-anchor="middle" dominant-baseline="central" fill="#85B7EB">ASSERT: 无 journal handle；trace enter</text>
<line class="arr" x1="340" y1="92" x2="340" y2="100" marker-end="url(#arrow)"/>
<polygon points="340,104 445,136 340,168 235,136" fill="#633806" stroke="#FAC775" stroke-width="0.5"/>
<text x="340" y="136" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#FAEEDA">forced_shutdown?</text>
<line class="arr" x1="445" y1="136" x2="486" y2="136" marker-end="url(#arrow)"/>
<text class="ts" x="458" y="124" text-anchor="middle" fill="#B4B2A9">是</text>
<rect x="490" y="112" width="150" height="48" rx="8" fill="#791F1F" stroke="#F09595" stroke-width="0.5"/>
<text x="565" y="130" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#F7C1C1">return -EIO</text>
<text x="565" y="148" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#F09595">致命错误已 shutdown</text>
<text class="ts" x="326" y="172" text-anchor="end" fill="#B4B2A9">否</text>
<line class="arr" x1="340" y1="168" x2="340" y2="176" marker-end="url(#arrow)"/>
<polygon points="340,180 445,212 340,244 235,212" fill="#633806" stroke="#FAC775" stroke-width="0.5"/>
<text x="340" y="212" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#FAEEDA">sb_rdonly?</text>
<line class="arr" x1="445" y1="212" x2="486" y2="212" marker-end="url(#arrow)"/>
<text class="ts" x="458" y="200" text-anchor="middle" fill="#B4B2A9">是</text>
<rect x="490" y="188" width="150" height="48" rx="8" fill="#791F1F" stroke="#F09595" stroke-width="0.5"/>
<text x="565" y="206" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#F7C1C1">-EROFS 或直接 out</text>
<text x="565" y="224" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#F09595">只读挂载无需提交</text>
<text class="ts" x="326" y="248" text-anchor="end" fill="#B4B2A9">否</text>
<line class="arr" x1="340" y1="244" x2="340" y2="252" marker-end="url(#arrow)"/>
<polygon points="340,256 445,288 340,320 235,288" fill="#633806" stroke="#FAC775" stroke-width="0.5"/>
<text x="340" y="288" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#FAEEDA">s_journal 存在?</text>
<line class="arr" x1="235" y1="288" x2="224" y2="288" marker-end="url(#arrow)"/>
<text class="ts" x="228" y="276" text-anchor="middle" fill="#B4B2A9">无</text>
<rect x="40" y="260" width="180" height="56" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="130" y="280" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#9FE1CB">ext4_fsync_nojournal</text>
<text x="130" y="298" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5DCAA5">刷数据+逐层刷父目录后 out</text>
<text class="ts" x="326" y="324" text-anchor="end" fill="#B4B2A9">有</text>
<line class="arr" x1="340" y1="320" x2="340" y2="332" marker-end="url(#arrow)"/>
<rect x="200" y="336" width="280" height="52" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text class="th" x="340" y="356" text-anchor="middle" dominant-baseline="central" fill="#B5D4F4">file_write_and_wait_range()</text>
<text class="ts" x="340" y="374" text-anchor="middle" dominant-baseline="central" fill="#85B7EB">数据脏页写回并等待落盘</text>
<line class="arr" x1="340" y1="388" x2="340" y2="400" marker-end="url(#arrow)"/>
<rect x="200" y="404" width="280" height="52" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
<text class="th" x="340" y="424" text-anchor="middle" dominant-baseline="central" fill="#9FE1CB">ext4_fsync_journal()</text>
<text class="ts" x="340" y="442" text-anchor="middle" dominant-baseline="central" fill="#5DCAA5">fc_commit / force_commit 提交元数据</text>
<line class="arr" x1="340" y1="456" x2="340" y2="468" marker-end="url(#arrow)"/>
<rect x="200" y="472" width="280" height="52" rx="8" fill="#633806" stroke="#FAC775" stroke-width="0.5"/>
<text class="th" x="340" y="492" text-anchor="middle" dominant-baseline="central" fill="#FAEEDA">needs_barrier → blkdev_issue_flush</text>
<text class="ts" x="340" y="510" text-anchor="middle" dominant-baseline="central" fill="#FAC775">事务未自带 flush 时补刷设备缓存</text>
<line class="arr" x1="340" y1="524" x2="340" y2="536" marker-end="url(#arrow)"/>
<rect x="200" y="540" width="280" height="52" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="th" x="340" y="560" text-anchor="middle" dominant-baseline="central" fill="#D3D1C7">out: file_check_and_advance_wb_err</text>
<text class="ts" x="340" y="578" text-anchor="middle" dominant-baseline="central" fill="#B4B2A9">errseq 汇总，返回首个错误</text>
</svg>