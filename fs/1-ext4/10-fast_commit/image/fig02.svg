<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 356" width="680" role="img"><style>text{font-family:'Microsoft YaHei',sans-serif;}text.th{font-size:14px;font-weight:500;}text.ts{font-size:12px;}.arr{stroke:#888780;stroke-width:1.5;fill:none;}.leader{stroke:#B4B2A9;stroke-width:0.5;stroke-dasharray:3 3;fill:none;}</style>
<title>FC 区布局与 tag 序列</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="40" y="60" width="110" height="60" rx="6" fill="#444441" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="95" y="82" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#D3D1C7">journal</text>
<text x="95" y="98" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#D3D1C7">superblock</text>
<rect x="150" y="60" width="330" height="60" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text x="315" y="80" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#B5D4F4">普通 journal 区</text>
<text x="315" y="98" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#85B7EB">完整事务：描述符 + 元数据块 + commit 块</text>
<rect x="480" y="60" width="160" height="60" rx="6" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="560" y="80" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#9FE1CB">FC 区（末尾预留）</text>
<text x="560" y="98" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5DCAA5">紧凑 tag 日志</text>
<text class="ts" x="340" y="146" text-anchor="middle" fill="#B4B2A9">FC 区与普通 journal 共享同一段连续空间（j_fc_first ~ j_fc_last），完整提交后被清空复用</text>
<rect x="40" y="180" width="64" height="52" rx="6" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="72" y="200" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#9FE1CB">HEAD</text>
<text x="72" y="218" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5DCAA5">tid</text>
<line class="arr" x1="104" y1="206" x2="112" y2="206" marker-end="url(#arrow)"/>
<rect x="116" y="180" width="120" height="52" rx="6" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="176" y="200" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#9FE1CB">目录项变更</text>
<text x="176" y="218" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5DCAA5">CREAT/LINK/UNLINK</text>
<line class="arr" x1="236" y1="206" x2="244" y2="206" marker-end="url(#arrow)"/>
<rect x="248" y="180" width="72" height="52" rx="6" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="284" y="200" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#9FE1CB">INODE</text>
<text x="284" y="218" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5DCAA5">完整 inode</text>
<line class="arr" x1="320" y1="206" x2="328" y2="206" marker-end="url(#arrow)"/>
<rect x="332" y="180" width="120" height="52" rx="6" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="392" y="200" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#9FE1CB">范围变更</text>
<text x="392" y="218" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5DCAA5">ADD/DEL_RANGE</text>
<line class="arr" x1="452" y1="206" x2="460" y2="206" marker-end="url(#arrow)"/>
<rect x="464" y="180" width="72" height="52" rx="6" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="500" y="200" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#9FE1CB">TAIL</text>
<text x="500" y="218" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5DCAA5">CRC32</text>
<line class="arr" x1="536" y1="206" x2="544" y2="206" marker-end="url(#arrow)"/>
<rect x="548" y="180" width="92" height="52" rx="6" fill="#444441" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="594" y="200" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#D3D1C7">commit</text>
<text x="594" y="218" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#B4B2A9">record</text>
<rect x="40" y="262" width="12" height="12" fill="#5DCAA5"/>
<text class="ts" x="60" y="272" fill="#B4B2A9">CREAT：新建 inode + 目录项</text>
<rect x="340" y="262" width="12" height="12" fill="#5DCAA5"/>
<text class="ts" x="360" y="272" fill="#B4B2A9">LINK/UNLINK：目录项增删（含同目录 rename）</text>
<rect x="40" y="292" width="12" height="12" fill="#5DCAA5"/>
<text class="ts" x="60" y="302" fill="#B4B2A9">ADD/DEL_RANGE：extent 范围增删</text>
<rect x="340" y="292" width="12" height="12" fill="#5DCAA5"/>
<text class="ts" x="360" y="302" fill="#B4B2A9">INODE：inode 元数据更新（兜底）</text>
<rect x="40" y="322" width="12" height="12" fill="#5DCAA5"/>
<text class="ts" x="60" y="332" fill="#B4B2A9">HEAD/TAIL：事务边界 + CRC32 校验</text>
<rect x="340" y="322" width="12" height="12" fill="#5DCAA5"/>
<text class="ts" x="360" y="332" fill="#B4B2A9">commit record：标记本次写入完整有效</text>
</svg>